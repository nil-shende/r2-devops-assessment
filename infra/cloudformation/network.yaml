AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  R2 NETWORK: VPC across 2 Availability Zones with three subnet tiers
  (public / private-app / private-data), Internet Gateway, optional NAT
  Gateways, free S3 gateway endpoint and VPC Flow Logs.

Parameters:
  ProjectName: { Type: String, Default: r2app }
  EnvironmentName:
    Type: String
    AllowedValues: [dev, staging, prod]
  VpcCidr:
    Type: String
    Default: 10.10.0.0/16
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/16$"
    Description: A /16 - it is split into six /24 subnets
  NatGatewayMode:
    Type: String
    AllowedValues: [none, single, per-az]
    Default: none
    Description: >-
      none   = no NAT (FREE TIER). App instances run in the public subnets with a public IP
               but accept traffic ONLY from the load balancer security group.
      single = one NAT Gateway (cheaper, AZ-dependent egress).
      per-az = one NAT Gateway per AZ (production high availability).
  EnableFlowLogs:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  FlowLogRetentionDays:
    Type: Number
    Default: 14

Conditions:
  HasNat: !Not [!Equals [!Ref NatGatewayMode, none]]
  NatPerAz: !Equals [!Ref NatGatewayMode, per-az]
  FlowLogs: !Equals [!Ref EnableFlowLogs, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-igw" }]
  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }

  # ---------------------------------------------------------------- Subnets (6 x /24)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: !If [HasNat, false, true]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-public-a" }, { Key: Tier, Value: public }]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: !If [HasNat, false, true]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-public-b" }, { Key: Tier, Value: public }]
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-app-a" }, { Key: Tier, Value: app }]
  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-app-b" }, { Key: Tier, Value: app }]
  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-data-a" }, { Key: Tier, Value: data }]
  DataSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-data-b" }, { Key: Tier, Value: data }]

  # ---------------------------------------------------------------- Public routing
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-public-rt" }]
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetBRta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  # ---------------------------------------------------------------- NAT (optional)
  NatEipA:
    Type: AWS::EC2::EIP
    Condition: HasNat
    DependsOn: IgwAttachment
    Properties: { Domain: vpc }
  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Condition: HasNat
    Properties:
      SubnetId: !Ref PublicSubnetA
      AllocationId: !GetAtt NatEipA.AllocationId
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-nat-a" }]
  NatEipB:
    Type: AWS::EC2::EIP
    Condition: NatPerAz
    DependsOn: IgwAttachment
    Properties: { Domain: vpc }
  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAz
    Properties:
      SubnetId: !Ref PublicSubnetB
      AllocationId: !GetAtt NatEipB.AllocationId
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-nat-b" }]

  # ---------------------------------------------------------------- Private app routing (one table per AZ)
  AppRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-app-rt-a" }]
  AppRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-app-rt-b" }]
  AppDefaultRouteA:
    Type: AWS::EC2::Route
    Condition: HasNat
    Properties:
      RouteTableId: !Ref AppRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA
  AppDefaultRouteB:
    Type: AWS::EC2::Route
    Condition: HasNat
    Properties:
      RouteTableId: !Ref AppRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [NatPerAz, !Ref NatGatewayB, !Ref NatGatewayA]
  AppSubnetARta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppSubnetA, RouteTableId: !Ref AppRouteTableA }
  AppSubnetBRta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppSubnetB, RouteTableId: !Ref AppRouteTableB }

  # ---------------------------------------------------------------- Data tier: NO route to the internet at all
  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-data-rt" }]
  DataSubnetARta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataSubnetA, RouteTableId: !Ref DataRouteTable }
  DataSubnetBRta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataSubnetB, RouteTableId: !Ref DataRouteTable }

  # S3 gateway endpoint is free: S3 traffic (CodeDeploy bundles, ECR layers) stays on the AWS network.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PublicRouteTable, !Ref AppRouteTableA, !Ref AppRouteTableB]

  # ---------------------------------------------------------------- VPC Flow Logs (optional)
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: FlowLogs
    Properties:
      LogGroupName: !Sub /${ProjectName}/${EnvironmentName}/vpc-flow-logs
      RetentionInDays: !Ref FlowLogRetentionDays
  FlowLogRole:
    Type: AWS::IAM::Role
    Condition: FlowLogs
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-flow-logs
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogGroups, logs:DescribeLogStreams]
                Resource: !GetAtt FlowLogGroup.Arn
  FlowLog:
    Type: AWS::EC2::FlowLog
    Condition: FlowLogs
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: REJECT
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${ProjectName}-${EnvironmentName}-VpcId" }
  VpcCidr:
    Value: !Ref VpcCidr
    Export: { Name: !Sub "${ProjectName}-${EnvironmentName}-VpcCidr" }
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: !Sub "${ProjectName}-${EnvironmentName}-PublicSubnetIds" }
  ComputeSubnetIds:
    Description: Where app instances run - private app subnets when NAT exists, otherwise public subnets
    Value: !If
      - HasNat
      - !Join [",", [!Ref AppSubnetA, !Ref AppSubnetB]]
      - !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: !Sub "${ProjectName}-${EnvironmentName}-ComputeSubnetIds" }
  DataSubnetIds:
    Value: !Join [",", [!Ref DataSubnetA, !Ref DataSubnetB]]
    Export: { Name: !Sub "${ProjectName}-${EnvironmentName}-DataSubnetIds" }
