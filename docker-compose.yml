# Local development stack that mirrors the AWS layout:
#   nginx (plays the ALB: /api/* -> backend, everything else -> frontend)
#   frontend (Next.js) | backend (FastAPI) | postgres (plays RDS)
# Run:  docker compose up --build   then open http://localhost:8080
services:
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ./apps/backend
    environment:
      APP_ENV: local
      DEPLOYMENT_TARGET: docker-compose
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: postgres
      DB_PASSWORD: postgres     # local only - in AWS the app reads Secrets Manager
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./apps/frontend
    environment:
      APP_ENV: local
      DEPLOYMENT_TARGET: docker-compose

  proxy:
    image: public.ecr.aws/docker/library/nginx:alpine
    volumes:
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [frontend, backend]
