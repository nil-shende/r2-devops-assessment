name: Infra deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/deploy-infra.sh"
      - "scripts/lib.sh"
      - ".github/workflows/infra-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'r2app' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cfn-lint

      - run: bash scripts/validate-templates.sh

  dev:
    needs: validate
    if: vars.CD_PROVIDER != 'aws'
    runs-on: ubuntu-latest
    environment: dev

    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Temporary OIDC diagnostic step
      - name: Diagnose GitHub OIDC claims
        shell: bash
        env:
          EXPECTED_ROLE: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"

          request = urllib.request.Request(
              url + separator + "audience=sts.amazonaws.com",
              headers={"Authorization": "Bearer " + token}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("========== OIDC DIAGNOSTICS ==========")
          print("Expected IAM role:", os.environ["EXPECTED_ROLE"])
          print("AWS Region:", os.environ.get("AWS_REGION"))
          print("OIDC issuer:", claims.get("iss"))
          print("OIDC audience:", claims.get("aud"))
          print("OIDC subject:", claims.get("sub"))
          print("Repository:", claims.get("repository"))
          print("Repository owner:", claims.get("repository_owner"))
          print("Git ref:", claims.get("ref"))
          print("Environment:", claims.get("environment"))
          print("Workflow:", claims.get("workflow"))
          print("======================================")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsInfraDeploy
          retry-max-attempts: 2

      - name: Verify AWS authentication
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity
          echo "AWS authentication successful"

      # Temporarily disabled during OIDC troubleshooting
      # - run: bash scripts/deploy-infra.sh dev plan
      # - run: bash scripts/deploy-infra.sh dev apply

  plan-staging:
    # Temporarily disabled during OIDC troubleshooting
    if: ${{ false }}
    needs: dev
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: bash scripts/deploy-infra.sh staging plan

  apply-staging:
    if: contains(vars.ENABLED_ENVIRONMENTS || 'dev', 'staging')
    needs: plan-staging
    runs-on: ubuntu-latest
    environment: staging

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: bash scripts/deploy-infra.sh staging apply

  plan-prod:
    if: contains(vars.ENABLED_ENVIRONMENTS || 'dev', 'prod')
    needs: apply-staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: bash scripts/deploy-infra.sh prod plan

  apply-prod:
    if: contains(vars.ENABLED_ENVIRONMENTS || 'dev', 'prod')
    needs: plan-prod
    runs-on: ubuntu-latest
    environment: prod

    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: bash scripts/deploy-infra.sh prod apply
