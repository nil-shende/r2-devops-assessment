# APPLICATION pipeline (GitHub Actions).
# Triggered ONLY by application paths. It builds once, then promotes the same
# immutable artifacts dev -> staging -> prod. Its IAM role has no CloudFormation
# write access, so it cannot modify infrastructure even by mistake.
name: App deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "deploy/codedeploy/**"
      - "scripts/build-*.sh"
      - "scripts/deploy-app.sh"
      - ".github/workflows/app-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write      # GitHub OIDC -> AWS STS (no stored AWS keys)
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'r2app' }}
  RELEASE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: bash scripts/test.sh

  build:
    needs: test
    if: vars.CD_PROVIDER != 'aws'        # when 'aws', CodePipeline does the CD instead
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bash scripts/build-and-push.sh "$RELEASE_TAG"

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    concurrency: { group: deploy-dev, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bash scripts/deploy-app.sh dev "$RELEASE_TAG"

  deploy-staging:
    # only runs once you add 'staging' to the repo variable ENABLED_ENVIRONMENTS (default: dev only, to stay in free tier)
    if: contains(vars.ENABLED_ENVIRONMENTS || 'dev', 'staging')
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging                 # add "Required reviewers" on this GitHub Environment
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bash scripts/deploy-app.sh staging "$RELEASE_TAG"

  deploy-prod:
    # only runs once you add 'prod' to the repo variable ENABLED_ENVIRONMENTS (default: dev only, to stay in free tier)
    if: contains(vars.ENABLED_ENVIRONMENTS || 'dev', 'prod')
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: prod                    # add "Required reviewers" on this GitHub Environment
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bash scripts/deploy-app.sh prod "$RELEASE_TAG"
